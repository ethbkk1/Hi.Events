services:
  hi-events-backend:
    build:
      context: ./../../backend
      dockerfile: Dockerfile
    container_name: hi-events-backend
    ports:
      - "8124:8080"
    env_file:
      - .env
    restart: unless-stopped
  hi-events-queue:
    image: backend-hi-events-backend:latest
    container_name: hi-events-queue
    working_dir: /var/www/html
    command: >
      php artisan queue:work
      --queue=default,webhook-queue
      --sleep=3
      --tries=3
      --timeout=60
      --max-jobs=500
      --max-time=3600
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - hi-events-backend
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
